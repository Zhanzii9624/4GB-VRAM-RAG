[project]
name = "aorus-rag"
version = "0.1.0"
description = "RAG QA system for GIGABYTE AORUS MASTER 16 AM6H specs — 4GB VRAM compatible"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.23",
    "llama-cpp-python",
    "gdown",
    "jieba>=0.42",
]

[project.optional-dependencies]
# CPU-only local dev / CI (no CUDA)
cpu = [
    "llama-cpp-python>=0.2.90",
]
# Evaluation extras
eval = [
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "tabulate>=0.9",
]

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cu124" }

[[tool.uv.index]]
name = "llama-cpp-cu124"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "inference"]
