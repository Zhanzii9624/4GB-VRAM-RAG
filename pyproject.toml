[project]
name = "aorus-rag"
version = "0.1.0"
description = "RAG QA system for GIGABYTE AORUS MASTER 16 AM6H specs — 4GB VRAM compatible"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.23",
    # llama-cpp-python is installed separately in Colab with CUDA flags
    # See scripts/install_llama_cpp_cuda.sh
]

[project.optional-dependencies]
# CPU-only local dev / CI (no CUDA)
cpu = [
    "llama-cpp-python>=0.2.90",
]
# Evaluation extras
eval = [
    "tabulate>=0.9",
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29",
    "tabulate>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "inference", "evaluation"]
